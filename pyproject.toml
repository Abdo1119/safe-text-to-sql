[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "safe-text-to-sql"
version = "0.1.0"
description = "Guardrailed natural-language analytics over a local SQL database."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Abdallah Hosni" }]
dependencies = [
    "google-genai>=1.33,<2",
    "numpy>=1.26,<2.5",
    "python-dotenv>=1.1,<2",
    "sqlglot>=26,<30",
    "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safe_text_to_sql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".migration", "legacy_reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = ["^\\.migration/", "^legacy_reference/"]
