name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: fake
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Initialize synthetic database
        run: python scripts/initialize_demo_db.py
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src tests scripts app.py
      - name: Test
        run: pytest
      - name: Deterministic evaluation
        run: python scripts/run_evaluation.py
      - name: Verify release safety
        run: python scripts/verify_release.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root image
        run: docker build -t safe-text-to-sql:${{ github.sha }} .
